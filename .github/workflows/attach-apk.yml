# Downloads the APK that EAS built (URL in mobile/release/apk-url.txt) and publishes it as a GitHub release asset.
# Nothing is committed back to main, so pushes from slow networks never need to pull a 60 MB binary first.
name: Attach release APK
on:
  push:
    branches: [main]
    paths: ['mobile/release/apk-url.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download APK built by EAS
        run: |
          url="$(tr -d '[:space:]' < mobile/release/apk-url.txt)"
          curl -fsSL --retry 3 -A "Mozilla/5.0" -o league-ops.apk "$url"
          ls -la league-ops.apk
          python3 -c "import zipfile; z=zipfile.ZipFile('league-ops.apk'); assert 'AndroidManifest.xml' in z.namelist(); print('valid apk')"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$tag" league-ops.apk --target "$GITHUB_SHA" --title "League Ops APK $tag" \
            --notes "Built by EAS: $(tr -d '[:space:]' < mobile/release/apk-url.txt)" --latest
