# Part II Section 1.3: runs on every push to main — backend contract probes, Selenium Grid 4 node
# verification + Guest Web Player suite, k6 load profile, and the Phase I + II unit tests.
name: Autograde
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autograde-${{ github.ref }}
  cancel-in-progress: true
jobs:
  autograde:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Throwaway per-run salts (the real team salts are never stored in the repository).
      DAY1_SALT: ci-day1-${{ github.run_id }}
      DAY2_SALT: ci-day2-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Start the full Phase I + Phase II stack
        run: docker compose up -d --build

      - name: Wait for /health (120 s budget)
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8080/health && exit 0; sleep 2; done
          docker compose ps; docker compose logs api | tail -80; exit 1

      - name: Backend contract probes
        run: python3 tests/contract_probes.py

      - name: Selenium Grid 4 node verification (ready, >= 3 nodes)
        run: |
          for i in $(seq 1 45); do
            python3 -c "import json,sys,urllib.request; v=json.load(urllib.request.urlopen('http://localhost:4444/status'))['value']; print('ready', v['ready'], 'nodes', len(v['nodes'])); sys.exit(0 if v['ready'] and len(v['nodes']) >= 3 else 1)" && exit 0
            sleep 2
          done
          exit 1

      - name: Selenium Guest Web Player suite (pytest -n 3 on the Grid)
        run: |
          curl -s -X POST http://localhost:8080/audit/v1/reset > /dev/null
          ./tests/run_selenium.sh

      - name: k6 load profile (500 guest viewers + 50 chat posters, 15 s)
        run: |
          curl -s -X POST http://localhost:8080/audit/v1/reset > /dev/null
          docker run --rm --user "$(id -u):$(id -g)" --network host -v "$PWD/tests":/tests grafana/k6:0.54.0 run \
            --summary-export=/tests/reports/k6-summary.json /tests/k6_load.js

      - name: Unit tests (Phase I regression + Phase II modules) with coverage
        run: ./run_tests.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            tests/reports/
            COVERAGE.json
            COVERAGE_DAY2.json
